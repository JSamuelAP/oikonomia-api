app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8080
  security:
    cookie-secure: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
