spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  cors:
    allowed-origins:
      - http://localhost:4200
  security:
    cookie-secure: false

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
