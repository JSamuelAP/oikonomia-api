server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: oikonomia-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  security:
    cookie-secure: true
