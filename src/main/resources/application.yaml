server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: oikonomia-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: []

  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  security:
    cookie-secure: true

springdoc:
  paths-to-match: /api/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
