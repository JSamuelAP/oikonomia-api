spring:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - http://localhost:4200

  jwt:
    secret: "test-secret-key-only-for-test-32-bytes-min-0123456789"
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  security:
    cookie-secure: true

springdoc:
  paths-to-match: /api/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

logging:
  level:
    org.springframework.test.context.support.AnnotationConfigContextLoaderUtils: WARN
